# Render Blueprint — deploys LawyerUp as a public demo (free web service + free PostgreSQL).
# Dashboard → New → Blueprint → pick this repository.
databases:
  - name: lawyerup-db
    plan: free
    databaseName: lawyerup
    user: lawyerup

services:
  - type: web
    name: lawyerup
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lawyerup-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESEED_HOURS
        value: "24"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: OTP_PROVIDER
        value: console
      - key: KYC_PROVIDER
        value: sandbox
      - key: VIDEO_PROVIDER
        value: jitsi
